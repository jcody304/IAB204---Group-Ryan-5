<!-- Tells the Browser this is a HTML5 Document -->
<!doctype html>

<!-- Root Element and English Attribute -->
<html lang='en'>

<head>
    <!-- Required Meta Tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Name Showed on Tab -->
    <title>Event Management App</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Link to CSS Style Sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/stylesheet.css') }}">
</head>

<body>
    <div class="page-wrapper">
        <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
            <a class="navbar-brand ms-3" href="/">Eventaman</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto">

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownEvents" role="button"
                            data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            My Events
                        </a>
                        <div class="dropdown-menu" aria-labelledby="navbarDropdownEvents">
                            <a class="dropdown-item" href="/events/create">Create Event +</a>
                            <a class="dropdown-item" href="">Update Event</a>
                            <a class="dropdown-item" href="/events/history">Event History</a>
                        </div>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                            data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            Categories
                        </a>
                        <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <a class="dropdown-item dropdown-toggle" href="#">Music</a>
                            <a class="dropdown-item dropdown-toggle" href="#">Sports</a>
                            <a class="dropdown-item dropdown-toggle" href="#">Theatre</a>
                            <a class="dropdown-item dropdown-toggle" href="#">Comedy</a>
                        </div>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2 ms-auto">
                    <button class="btn btn-outline-dark my-2 my-sm-0" type="submit">Search</button>
                    <input class="form-control" type="search" placeholder="Search" aria-label="Search">

                    <!-- User Status Options -->
                    {% if current_user.is_authenticated %}
                    <a class="btn btn-outline-primary my-2 my-sm-0 me-3" href="{{ url_for('auth.logout') }}">Logout</a>
                    {% else %}
                    <a class="btn btn-outline-primary my-2 my-sm-0 me-3" href="{{ url_for('auth.login') }}">Login</a>
                    {% endif %}
                </div>
            </div>
        </nav>

        <main>
            {% block content %}

            {% endblock %}
        </main>


        <footer class="footer">
            <div class="text-center py-2 bg-light">
                <span class="text-dark">Established &copy; 2026</span>
            </div>
        </footer>
        <!-- Bootstrap JS (includes Popper) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js">
            integrity = "sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
            crossorigin = "anonymous"
        </script>
    </div>
</body>

</html>
