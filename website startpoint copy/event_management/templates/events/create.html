{% extends "base.html" %}
{% from 'bootstrap5/form.html' import render_form %}
{% block content %}
<div class="container text-white">
    <div class="row mt-5">
        <div class="justify-content-center text-center mt-4">
            <img src="https://boomset.com/wp-content/uploads/2025/07/largest-concerts-ever.png"
                class="img-fluid mb-4 w-50" alt="Event Image">
        </div>
        <div class="col-md-12">
            <h1>Create Event</h1>
            <p>Please fill out the form to create a new event.</p>
            {{ render_form(form) }}
        </div>
    </div>
</div>
{% endblock %}
